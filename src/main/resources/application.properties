# ============================================================
# bff-gateway | Backend for Frontend Gateway
# Sistema RedNorte
# ============================================================

# --- Servidor ---
server.port=8085
spring.application.name=bff-gateway

# --- URLs de Microservicios downstream ---
ms.reasignacion.url=http://localhost:8084
ms.solicitudes.url=http://localhost:8082

# --- Feign (cliente HTTP declarativo) ---

spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=10000

# --- Resilience4j Circuit Breaker ---
# Configuración para el CB hacia ms-reasignacion
resilience4j.circuitbreaker.instances.reasignacionCB.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.reasignacionCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.reasignacionCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.reasignacionCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.reasignacionCB.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.reasignacionCB.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.reasignacionCB.automatic-transition-from-open-to-half-open-enabled=true

# Configuración para el CB hacia ms-lista-espera
resilience4j.circuitbreaker.instances.listaEsperaCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.listaEsperaCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.listaEsperaCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.listaEsperaCB.wait-duration-in-open-state=10s

# Exponer métricas del CB (útil para monitoreo)
resilience4j.circuitbreaker.instances.reasignacionCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.listaEsperaCB.register-health-indicator=true

# --- Swagger / OpenAPI ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.show-actuator=false

# --- Logging ---
logging.level.com.rednorte.bff_gateway=DEBUG
logging.level.org.springframework.web=INFO
logging.level.io.github.resilience4j=INFO

# --- ms-pacientes ---
ms.pacientes.url=http://localhost:8081
resilience4j.circuitbreaker.instances.pacientesCB.sliding-window-size=10
resilience4j.circuitbreaker.instances.pacientesCB.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.pacientesCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.pacientesCB.wait-duration-in-open-state=10s